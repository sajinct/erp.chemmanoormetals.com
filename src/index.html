<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chemmanoor Metals ERP</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#202b3b" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Apply the saved appearance before rendering to avoid a light flash.
      try {
        var preference = localStorage.getItem('chemmanoor-theme');
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) document.querySelector('meta[name="theme-color"]').content = '#101722';
      } catch (_) {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      }
    </script>
    <link rel="preload" href="manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Same typeface as chemmanoormetals.com, served from this site. */
      @font-face {
        font-family: Manrope;
        src: url('manrope-latin.woff2') format('woff2');
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
