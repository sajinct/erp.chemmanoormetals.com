# Settings pushed to the hosted Supabase project with `npx supabase config push`.
# Only what is declared here is managed from this file; everything else keeps
# the value set in the Supabase dashboard.
project_id = "erp.chemmanoormetals.com"

[auth]
# Where emailed links (confirm sign-up, reset password) send people.
site_url = "https://erp.chemmanoormetals.com"

[functions.manage-users]
# Validate the bearer token using Auth getUser inside the function. This also
# supports projects using asymmetric JWT signing keys.
verify_jwt = false
